# Paquetes de dbt para este proyecto. `dbt deps` los descarga en dbt_packages/
# (ignorado por git — se reconstruye en cada entorno, igual que node_modules o .venv).
#
# metaplane/dbt_expectations es el fork activo del paquete original calogica/dbt_expectations
# — dbt deps marca el paquete de calogica como deprecado en favor de este.
packages:
  - package: metaplane/dbt_expectations
    version: [">=0.10.0", "<0.11.0"]
